[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuxutools"
version = "0.1.0"
description = "Linux reimplementation of the 3uTools iOS device manager"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TuxuTools contributors" }]
keywords = ["ios", "3utools", "libimobiledevice", "pymobiledevice3", "idevice", "linux"]

dependencies = [
    "pymobiledevice3>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
firmware = ["ipsw_parser>=1.1", "pyimg4>=0.7"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
tuxutools = "tuxutools.cli:main"
tuxutools-gui = "tuxutools.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["tuxutools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
